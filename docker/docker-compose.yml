version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: nexotracker-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nexotracker
      MYSQL_USER: nexo
      MYSQL_PASSWORD: nexo123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: